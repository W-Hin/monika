name: monika
description: "MONIKA - Intelligent Mobile HR Management System with Geo-Fenced IoT Attendance Taking and Rule-Based Machine Learning Training Prediction"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # IoT Sensor packages (Phase 1: imported but not yet wired to real sensors)
  # Phase 2+ will activate these for real GPS, WiFi, and device token binding
  geolocator: ^13.0.4
  network_info_plus: ^6.1.1
  device_info_plus: ^11.4.0

  # Secure local storage for cached session data (Phase 2+)
  flutter_secure_storage: ^9.2.4

  # Supabase client — Auth, Postgres (via auto REST), Row Level Security (Phase 2+)
  supabase_flutter: ^2.0.0

  # HTTP client (kept for any future non-Supabase calls, e.g. Phase 5 ML endpoint)
  http: ^1.4.0

  # Local data persistence (Phase 1: not used; Phase 2+: cache tokens/settings)
  shared_preferences: ^2.5.3

  # Permission handling for GPS and WiFi access
  permission_handler: ^11.4.0

  # Date formatting utilities
  intl: ^0.20.2

  # Lets HR's Analytics report tiles hand off a real CSV file to the OS
  # share sheet (save / email / send) instead of just showing a summary
  # dialog with no actual file output.
  share_plus: ^10.1.4

  # Generates the branded, letterhead-style PDF export for Analytics report
  # tiles (mirrors the Report Layout Mockups artifact design).
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/img/monika_logo_icon_square.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/img/monika_logo_icon_square_transparent.png"

flutter:
  uses-material-design: true
  assets:
    - lib/img/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800